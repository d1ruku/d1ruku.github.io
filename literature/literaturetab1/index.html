<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Преступление и наказание — Карта глав</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #b8c8d8;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* ── CANVAS ── */
  #canvas {
    width: 100vw;
    height: 100vh;
    position: relative;
    cursor: grab;
  }
  #canvas.dragging { cursor: grabbing; }

  #world {
    position: absolute;
    width: 2400px;
    height: 1600px;
    top: 0; left: 0;
    transform-origin: 0 0;
  }

  /* SVG lines layer */
  #lines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ── NODE ── */
  .node {
    position: absolute;
    cursor: pointer;
    transform: translate(-50%, -50%);
    transition: filter 0.15s, transform 0.15s;
  }
  .node:hover { filter: brightness(1.12); transform: translate(-50%, -50%) scale(1.04); }
  .node:active { transform: translate(-50%, -50%) scale(0.97); }

  .node-inner {
    background: linear-gradient(160deg, #1a3a5c 0%, #0f2540 100%);
    border: 1.5px solid #3a6090;
    border-top-color: #5590c8;
    border-radius: 4px;
    padding: 0;
    min-width: 180px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
    overflow: hidden;
  }

  .node-inner.active {
    border-color: #5590c8;
    border-top-color: #88c0f0;
    box-shadow: 0 0 0 2px rgba(85,144,200,0.4), 0 4px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);
  }

  .node-label {
    background: linear-gradient(90deg, #1e4a7a 0%, #163a60 100%);
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid rgba(85,144,200,0.3);
  }

  .node-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #5590c8;
    flex-shrink: 0;
    box-shadow: 0 0 4px rgba(85,144,200,0.7);
  }

  .node-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #c8ddf0;
  }

  .node-body {
    padding: 7px 14px 9px;
    font-size: 12px;
    color: #8ab0d0;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  /* ── connector dots ── */
  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5590c8;
    border: 1.5px solid #3a6090;
    position: absolute;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* ── ROOT node ── */
  .node-root .node-inner {
    background: linear-gradient(160deg, #3a1a1a 0%, #1e0a0a 100%);
    border-color: #903030;
    border-top-color: #c84040;
    min-width: 220px;
  }
  .node-root .node-label {
    background: linear-gradient(90deg, #6a1a1a 0%, #4a1010 100%);
    border-bottom-color: rgba(200,64,64,0.3);
  }
  .node-root .node-dot { background: #c84040; box-shadow: 0 0 6px rgba(200,64,64,0.7); }
  .node-root .node-title { color: #f0c0c0; letter-spacing: 2px; font-size: 12px; }
  .node-root .node-body { color: #c08080; font-size: 11px; }

  /* ── EPILOG node ── */
  .node-epilog .node-inner {
    background: linear-gradient(160deg, #0a2a1a 0%, #051510 100%);
    border-color: #206040;
    border-top-color: #30a060;
  }
  .node-epilog .node-label {
    background: linear-gradient(90deg, #0e3a20 0%, #082814 100%);
    border-bottom-color: rgba(48,160,96,0.3);
  }
  .node-epilog .node-dot { background: #30a060; box-shadow: 0 0 6px rgba(48,160,96,0.7); }
  .node-epilog .node-title { color: #90e0b0; }
  .node-epilog .node-body { color: #60a080; }

  /* ── PANEL ── */
  #panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 420px;
    background: #0e1520;
    border-left: 1px solid #2a3a50;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    z-index: 100;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #panel.open { transform: translateX(0); }

  .panel-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid #2a3a50;
    flex-shrink: 0;
    background: linear-gradient(135deg, #12202e, #0e1825);
  }

  .panel-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .panel-title {
    font-size: 18px;
    font-weight: 700;
    color: #e0ecf8;
    letter-spacing: 0.5px;
    line-height: 1.3;
  }

  .panel-chars {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
  }

  .char-pill {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 20px;
    letter-spacing: 0.3px;
    background: rgba(85,144,200,0.15);
    border: 1px solid rgba(85,144,200,0.3);
    color: #80b8e0;
  }

  .panel-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 24px;
  }
  .panel-scroll::-webkit-scrollbar { width: 4px; }
  .panel-scroll::-webkit-scrollbar-track { background: transparent; }
  .panel-scroll::-webkit-scrollbar-thumb { background: #2a3a50; border-radius: 2px; }

  .section {
    margin-bottom: 18px;
  }

  .section-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #5590c8;
    margin-bottom: 8px;
    padding-bottom: 5px;
    border-bottom: 1px solid #1e3050;
  }

  .section p {
    font-size: 13px;
    line-height: 1.72;
    color: #90aac4;
  }

  .callout {
    padding: 9px 12px;
    border-radius: 4px;
    border-left: 3px solid;
    font-size: 12.5px;
    line-height: 1.6;
    margin: 8px 0;
  }
  .callout-red { background: rgba(200,64,64,0.08); border-color: #c84040; color: #d09090; }
  .callout-blue { background: rgba(85,144,200,0.08); border-color: #5590c8; color: #90b8d8; }
  .callout-green { background: rgba(48,160,96,0.08); border-color: #30a060; color: #80c8a0; }
  .callout-amber { background: rgba(200,140,40,0.08); border-color: #c88c28; color: #c8a060; }
  .callout-purple { background: rgba(140,80,200,0.08); border-color: #8c50c8; color: #b080d8; }

  em { font-style: italic; color: #a8c4e0; }
  strong { font-weight: 700; color: #c8ddf0; }

  .close-btn {
    position: absolute;
    top: 14px; right: 14px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid #2a3a50;
    color: #5590c8;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    z-index: 10;
  }
  .close-btn:hover { background: rgba(85,144,200,0.15); }

  /* ── HUD ── */
  #hud {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(10,20,35,0.9);
    border: 1px solid #2a3a50;
    border-radius: 24px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: #5590c8;
    backdrop-filter: blur(8px);
    z-index: 50;
    pointer-events: none;
  }
  .hud-sep { width: 1px; height: 14px; background: #2a3a50; }

  /* ── ZOOM BTNS ── */
  .zoom-btns {
    position: fixed;
    bottom: 20px; right: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 50;
  }
  .zoom-btn {
    width: 34px; height: 34px;
    background: rgba(10,20,35,0.9);
    border: 1px solid #2a3a50;
    border-radius: 8px;
    color: #5590c8;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    backdrop-filter: blur(8px);
  }
  .zoom-btn:hover { background: rgba(85,144,200,0.15); }

  /* ── GRID BG ── */
  #grid-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ── LOCKED overlay ── */
  .locked-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
  }

  @keyframes pulse-dot {
    0%,100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .conn-dot { animation: pulse-dot 2s ease-in-out infinite; }
</style>
</head>
<body>

<div id="canvas">
  <!-- Grid pattern via SVG bg -->
  <svg id="grid-bg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="smallGrid" width="28" height="28" patternUnits="userSpaceOnUse">
        <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#9aacba" stroke-width="0.3" opacity="0.35"/>
      </pattern>
      <pattern id="grid" width="140" height="140" patternUnits="userSpaceOnUse">
        <rect width="140" height="140" fill="url(#smallGrid)"/>
        <path d="M 140 0 L 0 0 0 140" fill="none" stroke="#8aa0b0" stroke-width="0.6" opacity="0.4"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </svg>

  <div id="world">
    <svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<!-- PANEL -->
<div id="panel">
  <div class="close-btn" onclick="closePanel()">✕</div>
  <div class="panel-header">
    <div class="panel-tag" id="panel-tag"></div>
    <div class="panel-title" id="panel-title"></div>
    <div class="panel-chars" id="panel-chars"></div>
  </div>
  <div class="panel-scroll" id="panel-content"></div>
</div>

<!-- HUD -->
<div id="hud">
  <span>📖 Преступление и наказание</span>
  <div class="hud-sep"></div>
  <span id="hud-open">Кликни на узел</span>
</div>

<!-- Zoom buttons -->
<div class="zoom-btns">
  <div class="zoom-btn" onclick="zoom(0.15)">+</div>
  <div class="zoom-btn" onclick="zoom(-0.15)">−</div>
  <div class="zoom-btn" onclick="resetView()" style="font-size:12px; letter-spacing:-0.5px;">⌂</div>
</div>

<script>

const NODES = [
  {

        <p>Психологический роман Достоевского, написанный в 1866 году. Исследует природу преступления, вины и нравственного возрождения через историю студента Родиона Раскольникова.</p>

    tagColor: '#c84040',
    heading: 'Рождение идеи',
    content: `
      <div class="section">
        <div class="section-title">Обстановка</div>
        <p>Жаркий, душный июльский Петербург 1860-х. Раскольников — 23-летний бывший студент-юрист — живёт в крошечной каморке <em>«шесть шагов длиной»</em> под самой крышей.</p>

      <div class="section">

        <div class="callout callout-amber">Детский сон: мужики забивают старую клячу. Символ жалости к слабым и ужаса перед жестокостью.</div>
      </div>
      <div class="section">
        <div class="section-title">Убийство</div>

      <div class="section">

        <p>Раскольников падает на землю, целует её: <em>«Я осквернил тебя… поклонюсь всей земле»</em> — символический акт покаяния перед миром.</p>
      </div>
    `
  },
  {
    id: 'p6', x: 1600, y: 630,
    title: 'Часть 6',
    sub: 'Признание в участке',
    chars: ['Свидригайлов', 'Раскольников', 'Соня', 'мать'],
    tag: 'ЧАСТЬ 6',
    tagColor: '#c84040',
    heading: 'Признание',
    content: `
      <div class="section">
        <div class="section-title">Ночь Свидригайлова</div>
        <div class="callout callout-red">Кошмары: является девочка, которую погубил — превращается в мёртвую соблазнительницу. Утром стреляется на улице.</div>
      </div>
      <div class="section">

        <p>Прощается с матерью — она уже теряет рассудок. Идёт к Соне, берёт у неё <strong>кипарисовый крестик</strong>.</p>

        <div class="section-title">Признание</div>

      </div>
      <div class="section">
        <div class="section-title">Приговор</div>
        <div class="callout callout-amber"><strong>8 лет каторги в Сибири.</strong></div>
      </div>
    `
  },
  {
    id: 'epilog', x: 1360, y: 820,
    cls: 'node-epilog',
    title: 'Эпилог',
    sub: 'Воскрешение',
    chars: ['Соня', 'Раскольников'],
    tag: 'ЭПИЛОГ',
    tagColor: '#30a060',
    heading: 'Воскрешение',
    content: `
      <div class="section">
        <div class="section-title">Каторга</div>
        <p>Раскольников озлоблен, замкнут, презирает всех. Тяжело болеет. Соня следует за ним в Сибирь — все её любят, называют <em>«матушкой»</em>.</p>
      </div>
      <div class="section">
        <div class="section-title">Сон о трихинах</div>
        <div class="callout callout-purple">Апокалиптический бред: мир заражён микробами <strong>«трихинами»</strong> — символами гордыни и эгоизма. Люди убивают друг друга во имя «нового слова».</div>
      </div>
      <div class="section">
        <div class="section-title">Перелом</div>
        <div class="callout callout-green"><em>«Их воскресла любовь. Сердце каждого было готово к целой жизни…»</em></div>
        <p style="margin-top:8px">Просыпается, плачет, бросается к ногам Сони. Берёт Евангелие. Начинается медленное возрождение.</p>
      </div>
      <div class="section">
        <div class="section-title">Финал</div>
        <div class="callout callout-green"><em>«…впереди их ждал великий, ещё не виданный подвиг»</em>.</div>
      </div>
    `
  }
];

// Edges: [from, to]
const EDGES = [
  ['root','p1'],['root','p2'],['root','p3'],['root','p4'],
  ['root','p5'],['root','p6'],['root','epilog'],
  ['p1','p2'],['p2','p3'],['p3','p4'],['p4','p5'],['p5','p6'],['p6','epilog']
];

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let scale = 1, tx = 0, ty = 0;
let dragging = false, dragStart = null, dragOrigin = null;
let activeNode = null;

const world = document.getElementById('world');
const canvas = document.getElementById('canvas');
const panel  = document.getElementById('panel');
const linesEl = document.getElementById('lines');

// ════════════════════════════════════════════
//  BUILD NODES
// ════════════════════════════════════════════
const nodeEls = {};
NODES.forEach(n => {
  const el = document.createElement('div');
  el.className = 'node ' + (n.cls || '');
  el.id = 'node-' + n.id;
  el.style.left = n.x + 'px';
  el.style.top  = n.y + 'px';
  el.innerHTML = `
    <div class="node-inner" id="inner-${n.id}">
      <div class="node-label">
        <div class="node-dot"></div>
        <div class="node-title">${n.title}</div>
      </div>
      <div class="node-body">${n.sub}</div>
    </div>
  `;
  el.addEventListener('click', e => { e.stopPropagation(); openPanel(n); });
  world.appendChild(el);
  nodeEls[n.id] = el;
});

// ════════════════════════════════════════════
//  BUILD LINES
// ════════════════════════════════════════════
function getNodeCenter(id) {
  const n = NODES.find(x => x.id === id);
  const el = nodeEls[id];
  const w = el.offsetWidth || 190;
  const h = el.offsetHeight || 62;
  return { x: n.x, y: n.y };
}

function drawLines() {
  const NODE_W = 190, NODE_H = 62;
  let svg = '';
  EDGES.forEach(([a, b]) => {
    const na = NODES.find(x => x.id === a);
    const nb = NODES.find(x => x.id === b);
    const ax = na.x, ay = na.y;
    const bx = nb.x, by = nb.y;

    // Dashed line style like the reference image
    const isSeq = ['p1p2','p2p3','p3p4','p4p5','p5p6','p6epilog'].includes(a+b);
    const stroke = isSeq ? '#5590c8' : '#3a6080';
    const dash = isSeq ? '' : 'stroke-dasharray="6 4"';
    const w = isSeq ? '1.5' : '1';

    // Arrow head for sequential
    const arrow = isSeq ? 'marker-end="url(#arrowhead)"' : '';

    svg += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="${stroke}" stroke-width="${w}" ${dash} opacity="0.6" ${arrow}/>`;

    // Connector dot at each end
    svg += `<circle cx="${ax}" cy="${ay}" r="4" fill="${stroke}" opacity="0.7"/>`;
    svg += `<circle cx="${bx}" cy="${by}" r="3" fill="${stroke}" opacity="0.5"/>`;
  });

  linesEl.innerHTML = `
    <defs>
      <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M2 2L8 5L2 8" fill="none" stroke="#5590c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    ${svg}
  `;
}

drawLines();

// ════════════════════════════════════════════
//  PAN & ZOOM
// ════════════════════════════════════════════
function applyTransform() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function initView() {
  // Center the map
  const cw = canvas.offsetWidth;
  const ch = canvas.offsetHeight;
  tx = cw/2 - 1200;
  ty = ch/2 - 800;
  scale = 0.7;
  applyTransform();
}

function zoom(delta) {
  const cw = canvas.offsetWidth;
  const ch = canvas.offsetHeight;
  const cx = cw/2, cy = ch/2;
  const prev = scale;
  scale = Math.min(2, Math.max(0.3, scale + delta));
  tx = cx - (cx - tx) * (scale / prev);
  ty = cy - (cy - ty) * (scale / prev);
  applyTransform();
}

function resetView() { initView(); }

canvas.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  dragOrigin = { x: tx, y: ty };
  canvas.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = dragOrigin.x + (e.clientX - dragStart.x);
  ty = dragOrigin.y + (e.clientY - dragStart.y);
  applyTransform();
});

window.addEventListener('mouseup', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  const cx = e.clientX, cy = e.clientY;
  const prev = scale;
  scale = Math.min(2, Math.max(0.3, scale + delta));
  tx = cx - (cx - tx) * (scale / prev);
  ty = cy - (cy - ty) * (scale / prev);
  applyTransform();
}, { passive: false });

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty };
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && lastTouch) {
    tx = lastTouch.tx + (e.touches[0].clientX - lastTouch.x);
    ty = lastTouch.ty + (e.touches[0].clientY - lastTouch.y);
    applyTransform();
  }
}, { passive: false });

// ════════════════════════════════════════════
//  PANEL
// ════════════════════════════════════════════
function openPanel(n) {
  // Deactivate previous
  if (activeNode) {
    document.getElementById('inner-' + activeNode)?.classList.remove('active');
  }
  activeNode = n.id;
  document.getElementById('inner-' + n.id)?.classList.add('active');

  document.getElementById('panel-tag').textContent = n.tag || '';
  document.getElementById('panel-tag').style.color = n.tagColor || '#5590c8';
  document.getElementById('panel-title').textContent = n.heading || n.title;
  document.getElementById('panel-chars').innerHTML = n.chars.map(c =>
    `<span class="char-pill">${c}</span>`
  ).join('');
  document.getElementById('panel-content').innerHTML = n.content;
  panel.classList.add('open');
  document.getElementById('hud-open').textContent = n.title + ' открыта';
}

function closePanel() {
  panel.classList.remove('open');
  if (activeNode) {
    document.getElementById('inner-' + activeNode)?.classList.remove('active');
    activeNode = null;
  }
  document.getElementById('hud-open').textContent = 'Кликни на узел';
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
window.addEventListener('load', () => {
  initView();
});
</script>
