<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главное меню</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            margin-bottom: 40px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            gap: 20px;
        }

        .btn {
            text-decoration: none;
            background: #4e73df;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #2e59d9;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>📚Задания📚</h1>

    <div class="menu">
        <a class="btn" href="/russiantab1/">Задания 171 и </a>
    </div>

</body>
</html>
