<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кроссворд — Физика §70–85</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap');
:root{
  --bg:#0e1017;--panel:#161b28;--border:#252d47;
  --acc:#e8c84a;--acc2:#5a9ee8;--text:#d8e2f5;--muted:#5a6888;
  --cell:#1c2235;--cell-hi:#2a2e18;--cell-sel:#1a2545;
  --cell-ok:#152b1e;--cell-ok-b:#3acd7a;
  --font-h:'Oswald',sans-serif;--font-b:'PT Serif',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);min-height:100vh}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:baseline;gap:14px}
header h1{font-family:var(--font-h);font-size:1.5rem;font-weight:700;color:var(--acc);letter-spacing:2px;text-transform:uppercase}
header span{font-size:.82rem;color:var(--muted);font-style:italic}
.tabs{display:flex;background:var(--panel);border-bottom:2px solid var(--border);padding:0 28px}
.tab{padding:9px 24px;cursor:pointer;font-family:var(--font-h);font-size:.85rem;letter-spacing:1px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;text-transform:uppercase}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
.tab:hover:not(.active){color:var(--text)}
.puzzle-wrap{display:none;flex-wrap:wrap;gap:28px;padding:24px 28px}
.puzzle-wrap.vis{display:flex}
.grid-sec{flex:0 0 auto}
.grid-lbl{font-family:var(--font-h);font-size:.7rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
table.cw{border-collapse:collapse}
td{width:34px;height:34px;background:transparent;border:none;position:relative;padding:0}
td.W{background:var(--cell);border:1px solid var(--border);cursor:pointer}
td.W.hi{background:var(--cell-hi);border-color:var(--acc)}
td.W.sel{background:var(--cell-sel);border-color:var(--acc2)}
td.W.ok{background:var(--cell-ok);border-color:var(--cell-ok-b)}
.cnum{position:absolute;top:2px;left:2px;font-size:8px;font-family:var(--font-h);color:var(--acc);line-height:1;pointer-events:none;font-weight:700}
td input{width:100%;height:100%;background:transparent;border:none;outline:none;text-align:center;font-size:.95rem;font-family:var(--font-h);font-weight:700;color:var(--text);text-transform:uppercase;cursor:pointer;caret-color:transparent}
.clues-sec{flex:1 1 280px}
.clues-cols{display:flex;gap:20px;flex-wrap:wrap}
.cg{flex:1 1 200px}
.cg h3{font-family:var(--font-h);font-size:.75rem;letter-spacing:2px;color:var(--acc);text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.ci{display:flex;gap:7px;padding:4px 5px;border-radius:3px;cursor:pointer;transition:background .15s;font-size:.84rem;line-height:1.4}
.ci:hover{background:var(--cell)}
.ci.act{background:var(--cell-hi);color:var(--acc)}
.cn{font-family:var(--font-h);font-weight:700;color:var(--acc);min-width:20px;font-size:.82rem}
.ctrl{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
button{font-family:var(--font-h);font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;padding:7px 18px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;border-radius:2px;transition:all .2s}
button:hover{border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);color:#111;border-color:var(--acc)}
button.pri:hover{background:#f0d860}
.msg{font-family:var(--font-h);font-size:.9rem;padding:6px 14px;background:var(--cell-ok);color:var(--cell-ok-b);border:1px solid var(--cell-ok-b);border-radius:2px;display:none}
.msg.vis{display:inline-block}
</style>
</head>
<body>
<header>
  <h1>Кроссворд</h1>
  <span>Физика 10 класс · §70–85 · Мякишев</span>
</header>
<div class="tabs">
  <div class="tab active" onclick="show('my')">Мой вариант</div>
  <div class="tab" onclick="show('auto')">Авторский вариант</div>
</div>

<div id="puz-my" class="puzzle-wrap vis">
  <div class="grid-sec"><div class="grid-lbl">Сетка</div><table class="cw" id="g-my"></table>
    <div class="ctrl">
      <button class="pri" onclick="check('my')">Проверить</button>
      <button onclick="reveal('my')">Ответы</button>
      <button onclick="clear_p('my')">Очистить</button>
      <span class="msg" id="msg-my"></span>
    </div>
  </div>
  <div class="clues-sec"><div class="clues-cols">
    <div class="cg"><h3>По горизонтали</h3><div id="ac-my"></div></div>
    <div class="cg"><h3>По вертикали</h3><div id="dn-my"></div></div>
  </div></div>
</div>

<div id="puz-auto" class="puzzle-wrap">
  <div class="grid-sec"><div class="grid-lbl">Сетка</div><table class="cw" id="g-auto"></table>
    <div class="ctrl">
      <button class="pri" onclick="check('auto')">Проверить</button>
      <button onclick="reveal('auto')">Ответы</button>
      <button onclick="clear_p('auto')">Очистить</button>
      <span class="msg" id="msg-auto"></span>
    </div>
  </div>
  <div class="clues-sec"><div class="clues-cols">
    <div class="cg"><h3>По горизонтали</h3><div id="ac-auto"></div></div>
    <div class="cg"><h3>По вертикали</h3><div id="dn-auto"></div></div>
  </div></div>
</div>

<script>
// ============================================================
// МОЙ ВАРИАНТ (слова пользователя)
// ============================================================
const MY = [
  {word:'ИЗОПРОЦЕССЫ',  row:0,  col:0,  dir:'across', clue:'Процессы с одним постоянным параметром'},
  {word:'КРИСТАЛЛЫ',    row:1,  col:0,  dir:'across', clue:'Тела с упорядоченным расположением атомов'},
  {word:'ИСПАРЕНИЕ',    row:2,  col:0,  dir:'across', clue:'Превращение жидкости в пар с поверхности'},
  {word:'ИЗОХОРА',      row:4,  col:0,  dir:'across', clue:'Процесс при постоянном объёме'},
  {word:'ИЗОБАРА',      row:6,  col:0,  dir:'across', clue:'Процесс при постоянном давлении'},
  {word:'КОНДЕНСАЦИЯ',  row:8,  col:0,  dir:'across', clue:'Переход пара в жидкость'},
  {word:'ВЛАЖНОСТЬ',    row:9,  col:0,  dir:'across', clue:'Содержание водяного пара в воздухе'},
  {word:'АНИЗОТРОПИЯ',  row:10, col:0,  dir:'across', clue:'Зависимость свойств кристалла от направления'},
  {word:'ДОМЕНЫ',       row:11, col:0,  dir:'across', clue:'Области с одной ориентацией молекул'},
  {word:'МОНОКРИСТАЛЛЫ',row:12, col:0,  dir:'across', clue:'Одиночные кристаллы'},
  {word:'ТЕПЛООБМЕН',   row:13, col:3,  dir:'across', clue:'Передача тепловой энергии между телами'},
  {word:'ПОЛИКРИСТАЛЛЫ',row:14, col:1,  dir:'across', clue:'Тела из множества мелких кристалликов'},
  {word:'МОЛЬ',         row:15, col:0,  dir:'across', clue:'Единица количества вещества (6·10²³ частиц)'},
  {word:'КИПЕНИЕ',      row:3,  col:9,  dir:'down',   clue:'Парообразование по всему объёму жидкости'},
  {word:'ПАР',          row:5,  col:6,  dir:'down',   clue:'Газообразное состояние вещества'},
];

// ============================================================
// АВТОРСКИЙ ВАРИАНТ
// ============================================================
const AUTO = [
  {word:'АНИЗОТРОПИЯ',  row:0,  col:0,  dir:'across', clue:'Зависимость свойств от направления'},
  {word:'НАСЫЩЕНИЕ',    row:1,  col:0,  dir:'across', clue:'Состояние равновесия пара с жидкостью (без слова «пар»)'},
  {word:'ИСПАРЕНИЕ',    row:2,  col:0,  dir:'across', clue:'Переход жидкости в пар с поверхности'},
  {word:'ИЗОТРОПИЯ',    row:4,  col:0,  dir:'across', clue:'Одинаковость свойств во всех направлениях'},
  {word:'КОНДЕНСАЦИЯ',  row:6,  col:0,  dir:'across', clue:'Переход пара в жидкость'},
  {word:'ДАВЛЕНИЕ',     row:8,  col:0,  dir:'across', clue:'Не зависит от объёма у насыщенного пара'},
  {word:'ВЛАЖНОСТЬ',    row:9,  col:0,  dir:'across', clue:'Содержание пара в воздухе'},
  {word:'ПОВЕРХНОСТЬ',  row:10, col:0,  dir:'across', clue:'Зона испарения жидкости'},
  {word:'КРИСТАЛЛ',     row:11, col:0,  dir:'across', clue:'Тело с упорядоченным строением'},
  {word:'ТЕМПЕРАТУРА',  row:12, col:0,  dir:'across', clue:'Постоянная при кипении величина'},
  {word:'ТЕПЛОТА',      row:13, col:0,  dir:'across', clue:'Вид теплообмена без совершения работы'},
  {word:'АМОРФНЫЙ',     row:14, col:2,  dir:'across', clue:'Тип тела без строгого порядка атомов'},
  {word:'ПУЗЫРЕК',      row:15, col:0,  dir:'across', clue:'Центр парообразования при кипении'},
  {word:'КИПЕНИЕ',      row:1,  col:9,  dir:'down',   clue:'Парообразование по всему объёму жидкости'},
  {word:'ДОМЕН',        row:6,  col:3,  dir:'down',   clue:'Область в жидком кристалле'},
];

// ============================================================
// ENGINE
// ============================================================
function buildCells(words) {
  const map = {};
  let maxR=0, maxC=0;
  for (const w of words) {
    for (let i=0; i<w.word.length; i++) {
      const r = w.dir==='across' ? w.row : w.row+i;
      const c = w.dir==='across' ? w.col+i : w.col;
      maxR = Math.max(maxR, r); maxC = Math.max(maxC, c);
      const k = r+','+c;
      if (!map[k]) map[k] = {r,c,letter:w.word[i],nums:[]};
    }
  }
  // Number cells
  let n=1;
  const starts = {};
  for (const w of words) {
    const k = w.row+','+w.col;
    if (!starts[k]) starts[k]=[];
    starts[k].push(w);
  }
  for (let r=0; r<=maxR; r++) {
    for (let c=0; c<=maxC; c++) {
      const k=r+','+c;
      if (starts[k]) {
        map[k] && map[k].nums.push(n);
        for (const w of starts[k]) w.num=n;
        n++;
      }
    }
  }
  return {map, rows:maxR+1, cols:maxC+1};
}

function renderGrid(pid, words) {
  const {map, rows, cols} = buildCells(words);
  const tbl = document.getElementById('g-'+pid);
  tbl.innerHTML='';
  for (let r=0; r<rows; r++) {
    const tr=document.createElement('tr');
    for (let c=0; c<cols; c++) {
      const td=document.createElement('td');
      const cell=map[r+','+c];
      if (cell) {
        td.className='W';
        td.dataset.r=r; td.dataset.c=c; td.dataset.letter=cell.letter;
        if (cell.nums.length) {
          const sp=document.createElement('span');
          sp.className='cnum'; sp.textContent=cell.nums[0]; td.appendChild(sp);
        }
        const inp=document.createElement('input');
        inp.maxLength=1;
        inp.dataset.r=r; inp.dataset.c=c;
        inp.addEventListener('input', e=>onInput(e,pid,words,map,rows,cols));
        inp.addEventListener('keydown', e=>onKey(e,pid,words,map,rows,cols));
        inp.addEventListener('focus', e=>onFocus(e,pid,words,map));
        td.appendChild(inp);
        td.addEventListener('click', ()=>inp.focus());
      }
      tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
}

function getTd(pid,r,c){return document.querySelector(`#g-${pid} td[data-r="${r}"][data-c="${c}"]`)}
function getInp(pid,r,c){const td=getTd(pid,r,c);return td?td.querySelector('input'):null}

function wordAt(words,r,c,preferDir){
  const matches=words.filter(w=>{
    if(w.dir==='across') return w.row===r && c>=w.col && c<w.col+w.word.length;
    return w.col===c && r>=w.row && r<w.row+w.word.length;
  });
  if(!matches.length) return null;
  if(preferDir) return matches.find(m=>m.dir===preferDir)||matches[0];
  return matches[0];
}

const curDir={my:'across',auto:'across'};

function onFocus(e,pid,words,map){
  const r=+e.target.dataset.r, c=+e.target.dataset.c;
  highlight(pid,words,r,c,curDir[pid]);
}

function highlight(pid,words,r,c,dir){
  document.querySelectorAll(`#g-${pid} td.W`).forEach(td=>td.classList.remove('hi','sel'));
  document.querySelectorAll(`#ac-${pid} .ci,#dn-${pid} .ci`).forEach(el=>el.classList.remove('act'));
  const w=wordAt(words,r,c,dir);
  if(!w) return;
  curDir[pid]=w.dir;
  for(let i=0;i<w.word.length;i++){
    const wr=w.dir==='across'?w.row:w.row+i;
    const wc=w.dir==='across'?w.col+i:w.col;
    const td=getTd(pid,wr,wc); if(td) td.classList.add('hi');
  }
  const td=getTd(pid,r,c); if(td){td.classList.remove('hi');td.classList.add('sel');}
  const cid=w.dir==='across'?'ac-':'dn-';
  const el=document.querySelector(`#${cid}${pid} [data-num="${w.num}"]`);
  if(el){el.classList.add('act');el.scrollIntoView({block:'nearest'});}
}

function onInput(e,pid,words,map,rows,cols){
  const inp=e.target;
  let v=inp.value.replace(/[^а-яёА-ЯЁa-zA-Z]/g,'').toUpperCase();
  inp.value=v.slice(-1);
  if(inp.value){
    const r=+inp.dataset.r, c=+inp.dataset.c;
    const w=wordAt(words,r,c,curDir[pid]);
    if(w){
      const nr=w.dir==='across'?r:r+1;
      const nc=w.dir==='across'?c+1:c;
      const next=getInp(pid,nr,nc);
      if(next) next.focus();
    }
  }
}

function onKey(e,pid,words,map,rows,cols){
  const inp=e.target;
  const r=+inp.dataset.r, c=+inp.dataset.c;
  if(e.key==='Backspace'&&!inp.value){
    const w=wordAt(words,r,c,curDir[pid]);
    if(w){
      const nr=w.dir==='across'?r:r-1;
      const nc=w.dir==='across'?c-1:c;
      const prev=getInp(pid,nr,nc);
      if(prev){prev.value='';prev.focus();}
    }
    e.preventDefault();
  }
  // Tab switches direction
  if(e.key==='Tab'){
    e.preventDefault();
    curDir[pid]=curDir[pid]==='across'?'down':'across';
    const inp2=getInp(pid,r,c); if(inp2) inp2.focus();
  }
}

function renderClues(pid,words){
  const ac=document.getElementById('ac-'+pid);
  const dn=document.getElementById('dn-'+pid);
  ac.innerHTML=''; dn.innerHTML='';
  const sorted=[...words].sort((a,b)=>a.num-b.num);
  for(const w of sorted){
    const div=document.createElement('div');
    div.className='ci'; div.dataset.num=w.num;
    div.innerHTML=`<span class="cn">${w.num}</span><span>${w.clue}</span>`;
    div.addEventListener('click',()=>{
      curDir[pid]=w.dir;
      const inp=getInp(pid,w.row,w.col); if(inp) inp.focus();
    });
    (w.dir==='across'?ac:dn).appendChild(div);
  }
}

function check(pid){
  const words=pid==='my'?MY:AUTO;
  const {map}=buildCells(words);
  let all=true;
  for(const [k,cell] of Object.entries(map)){
    const inp=getInp(pid,cell.r,cell.c);
    const td=getTd(pid,cell.r,cell.c);
    if(!inp) continue;
    if(inp.value.toUpperCase()===cell.letter) td.classList.add('ok');
    else {td.classList.remove('ok'); all=false;}
  }
  const msg=document.getElementById('msg-'+pid);
  if(all){msg.textContent='✓ Всё верно!';msg.classList.add('vis');}
  else{msg.textContent='';msg.classList.remove('vis');}
}

function reveal(pid){
  const words=pid==='my'?MY:AUTO;
  const {map}=buildCells(words);
  for(const [k,cell] of Object.entries(map)){
    const inp=getInp(pid,cell.r,cell.c);
    const td=getTd(pid,cell.r,cell.c);
    if(inp) inp.value=cell.letter;
    if(td) td.classList.add('ok');
  }
}

function clear_p(pid){
  document.querySelectorAll(`#g-${pid} input`).forEach(i=>i.value='');
  document.querySelectorAll(`#g-${pid} td`).forEach(td=>td.classList.remove('ok'));
  const msg=document.getElementById('msg-'+pid);
  msg.textContent=''; msg.classList.remove('vis');
}

function show(id){
  document.querySelectorAll('.puzzle-wrap').forEach(el=>el.classList.remove('vis'));
  document.getElementById('puz-'+id).classList.add('vis');
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active',(i===0&&id==='my')||(i===1&&id==='auto'));
  });
}

// INIT
buildCells(MY);
renderGrid('my',MY);
renderClues('my',MY);
buildCells(AUTO);
renderGrid('auto',AUTO);
renderClues('auto',AUTO);
</script>
</body>
</html>
